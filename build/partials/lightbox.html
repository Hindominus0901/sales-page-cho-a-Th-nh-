<div class="fc2-lb" id="fc2-lightbox" role="dialog" aria-modal="true" aria-label="Trình phát video feedback">
  <button type="button" class="fc2-lb-close" data-lb-close aria-label="Đóng video">✕</button>
  <button type="button" class="fc2-lb-nav fc2-lb-prev" data-lb-prev aria-label="Video trước">‹</button>
  <video data-lb-video controls playsinline preload="none"></video>
  <div class="fc2-lb-yt" data-lb-yt hidden></div>
  <img class="fc2-lb-img" data-lb-img hidden alt="">
  <button type="button" class="fc2-lb-nav fc2-lb-next" data-lb-next aria-label="Video sau">›</button>
  <div class="fc2-lb-cap" data-lb-caption></div>
</div>
