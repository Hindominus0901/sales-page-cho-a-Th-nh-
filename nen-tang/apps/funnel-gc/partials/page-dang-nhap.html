<div class="fc2" style="background:#f3ead9;color:#191919;min-height:100vh">
  <div style="max-width:460px;margin:0 auto;padding:56px 22px 72px">

    <div style="font-size:12px;font-weight:700;color:#2f7a4d;letter-spacing:.06em;margin-bottom:10px">GÓC CREATOR</div>
    <h1 style="font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-.02em;margin:0 0 8px">Vào lớp</h1>
    <p style="font-size:16px;line-height:1.7;color:#55555c;margin:0 0 26px">
      Đăng nhập bằng email anh chị đã dùng khi đăng ký khoá học.
    </p>

    <form data-form class="fc2-shadow" style="background:#fff;border-radius:24px;padding:24px;display:grid;gap:16px">
      <label style="display:grid;gap:6px">
        <span style="font-size:13px;font-weight:600">Email</span>
        <input name="email" type="email" inputmode="email" autocomplete="email" required
               placeholder="email@cua-anh-chi.com"
               style="height:52px;border:1px solid rgba(25,25,25,.16);border-radius:14px;padding:0 14px;font:inherit;font-size:16px">
      </label>
      <label style="display:grid;gap:6px">
        <span style="font-size:13px;font-weight:600">Mật khẩu</span>
        <input name="password" type="password" autocomplete="current-password" required
               style="height:52px;border:1px solid rgba(25,25,25,.16);border-radius:14px;padding:0 14px;font:inherit;font-size:16px">
      </label>
      <button type="submit" class="fc2-cta"
              style="height:54px;background:#2f7a4d;color:#fff;font-weight:700;font-size:16px;border:0;border-radius:16px;cursor:pointer">
        Vào lớp
      </button>
      <p data-msg style="font-size:14px;line-height:1.6;margin:0"></p>
      <a href="/quen-mat-khau?vai=hv" style="text-align:center;font-size:13.5px;color:#55555c;text-decoration:none">
        Quên mật khẩu?
      </a>
    </form>

    <!-- Học viên cũ chưa từng đặt mật khẩu sẽ đứng ở đây và không biết làm gì.
         Nói thẳng cho họ đường đi, thay vì để họ nhắn Zalo hỏi. -->
    <div class="fc2-shadow" style="background:#fff;border-radius:20px;padding:20px;margin-top:16px">
      <div style="font-size:15px;font-weight:700;margin-bottom:6px">Chưa có mật khẩu?</div>
      <p style="font-size:14px;line-height:1.7;color:#55555c;margin:0">
        Nếu anh chị vẫn đang vào lớp bằng đường link riêng trong email, mở đúng
        đường link đó — ở đầu trang có nút đặt mật khẩu. Đặt xong thì lần sau
        đăng nhập ở đây, không cần link nữa.
      </p>
    </div>
  </div>
</div>
